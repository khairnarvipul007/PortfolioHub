services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfoliohub-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfoliohub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
